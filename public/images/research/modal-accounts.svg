<svg xmlns="http://www.w3.org/2000/svg" width="760" height="260" viewBox="0 0 760 260" role="img" aria-labelledby="title desc">
<title id="title">Three accounts of modal choice</title><desc id="desc">Planned comparison, not a result. Published human choices are modelled with strength only, a source condition in meaning, or competition with bare assertions. Model recovery and held-out prediction test whether these accounts can be distinguished.</desc>
