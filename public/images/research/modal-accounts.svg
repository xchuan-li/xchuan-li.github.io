<text x="110" y="72" font-size="17" fill="#4c515c">Published human choices</text>
<text x="110" y="118" font-size="24" font-style="italic">p · must p</text><text x="110" y="153" font-size="22" font-style="italic">probably p · might p</text>
<text x="110" y="199" font-size="15" fill="#4c515c">Evidence strength + source</text>
<g fill="#f6f7f8" stroke="#c2c8d0"><rect x="276" y="39" width="209" height="50"/><rect x="276" y="105" width="209" height="50"/><rect x="276" y="171" width="209" height="50"/></g>
<text x="381" y="70" font-size="20">Strength only</text><text x="381" y="136" font-size="20">Source in meaning</text><text x="381" y="201" font-size="20">Competition</text>
<text x="650" y="104" font-size="22" fill="#17457a">Compare accounts</text><text x="650" y="140" font-size="17">Model recovery</text><text x="650" y="168" font-size="17">Held-out prediction</text>
<text x="381" y="248" font-size="14" fill="#4c515c">Three candidate explanations · no winner assumed</text>
