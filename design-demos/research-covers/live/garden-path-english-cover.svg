<svg xmlns="http://www.w3.org/2000/svg" width="420" height="286" viewBox="0 0 420 286" role="img" aria-labelledby="title desc">
<title id="title">An initial attachment and the complete English sentence structure</title>
<desc id="desc">While the teacher taught the students waited outside. Initially, the students may be attached as the object of taught. In the complete structure, the students is the subject of waited outside. This illustrates a processing hypothesis.</desc>
<rect width="420" height="286" fill="white"/>
<g font-family="Georgia,serif" font-style="italic" font-size="21" fill="#283648"><text x="20" y="34">While the teacher taught the students</text><text x="20" y="61">waited outside.</text></g>
<path d="M20 80H400" stroke="#87919c" stroke-width="1"/>
<g font-family="Arial,sans-serif" font-size="16" fill="#65717e"><text x="20" y="110">a. Initial</text><text x="20" y="182">b. Complete</text></g>
<g font-family="Georgia,serif" font-size="18" fill="#283648">
<text x="34" y="140">[While the teacher taught <tspan fill="#17457a">[the students]</tspan><tspan font-family="Arial,sans-serif" font-size="12" letter-spacing="0.6" baseline-shift="sub" fill="#17457a">OBJ</tspan>] <tspan fill="#87919c">…</tspan></text>
<text x="34" y="212">[While the teacher taught]</text>
<text x="34" y="242"><tspan fill="#17457a">[the students]</tspan><tspan font-family="Arial,sans-serif" font-size="12" letter-spacing="0.6" baseline-shift="sub" fill="#17457a">SUBJ</tspan> [waited outside]</text>
</g>
<path d="M20 266H400" stroke="#87919c" stroke-width="1"/>
</svg>
